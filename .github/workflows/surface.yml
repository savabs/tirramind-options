# The public Deribit tab, refit every 30 minutes.
#
# It deploys to Pages as a build artifact rather than committing the rendered
# page back to the repository. Forty-eight commits a day of a 60 KB file would
# bury the ledger's own history in noise within a week, and the page is a
# derived artefact: the ledger is the record, this is a view.
name: surface

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/tmo/page.py", "src/tmo/service/**", ".github/workflows/surface.yml"]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Render
        run: PYTHONPATH=src python -m tmo.page site/index.html

      - name: Verify the page actually says something
        # The gate. A page that rendered is not evidence. It checks the data the
        # page carries, not the markup: the last version scraped for a hardcoded
        # currency name and failed the moment market keys became venue-qualified,
        # which is the gate working but for the wrong reason.
        run: |
          set -eu
          python - <<'PY'
          import json, sys

          data = json.load(open("site/surface.json", encoding="utf-8"))
          surfaces = data.get("surfaces", {})
          venues = {s.get("venue") for s in surfaces.values()}
          html = open("site/index.html", encoding="utf-8").read()

          # A confused price convention does not raise; it publishes a surface
          # that is wrong by the price of the underlying. This is the check that
          # would catch it, so it is a gate and not a comment.
          worst = max((s["quality"].get("convention_check_vol_pts", 99)
                       for s in surfaces.values()), default=99)

          checks = {
              "at least six markets": len(surfaces) >= 6,
              "more than one venue": len(venues) >= 2,
              "every market agrees with its venue to 1 vol pt": worst <= 1.0,
              "the page carries its data": "window.__SURFACES__={" in html,
              "the page quotes a real error": any(
                  s["quality"]["rmse_vol_pts"] > 0 for s in surfaces.values()),
              "the page fetches nothing": "<script src=" not in html,
          }
          for name, ok in checks.items():
              print(("PASS  " if ok else "FAIL  ") + name)
          print(f"       {len(surfaces)} markets across {sorted(venues)}; "
                f"worst convention check {worst:.2f} vol pts")
          for k in sorted(data.get("failed", {})):
              print(f"       did not fit: {k} -- {data['failed'][k]}")
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: Archive this fit
        # The page is a view of the latest fit; this keeps every fit. It runs
        # after the gate, so a page that failed its checks is never archived,
        # and it does not fail the job: losing one fit is a gap in a series,
        # while failing here would stop the page from publishing at all.
        if: env.ARCHIVE_SECRET != ''
        env:
          ARCHIVE_SECRET: ${{ secrets.TMO_ARCHIVE_SECRET }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/archive.out -w "%{http_code}" \
            -X POST https://tirramind-options.pages.dev/api/archive \
            -H "Authorization: Bearer $ARCHIVE_SECRET" \
            -H "Content-Type: application/json" \
            -H "User-Agent: tirramind-options-ci/1.0" \
            --data-binary @site/surface.json) || true
          echo "archive -> $code $(head -c 200 /tmp/archive.out)"
          [ "$code" = "200" ] || echo "::warning::the fit was not archived"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
